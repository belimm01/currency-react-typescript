server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built SPA, falling back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the Czech National Bank API so the browser avoids CORS issues,
    # mirroring the Vite dev-server proxy.
    location /cs/ {
        proxy_pass https://www.cnb.cz;
        proxy_set_header Host www.cnb.cz;
        proxy_ssl_server_name on;
    }
}
